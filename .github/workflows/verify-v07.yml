name: Verify v0.7 release
on:
  push:
    branches: [preview/water-camera-v0.7]
    paths:
      - scripts/verify-release.mjs
      - .github/workflows/verify-v07.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - run: node scripts/verify-release.mjs
